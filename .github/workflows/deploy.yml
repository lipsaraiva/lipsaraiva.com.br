name: Deploy VPS
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/lipsaraiva.com.br/public_html
            git pull origin main
            chown -R lipsa7087:lipsa7087 /home/lipsaraiva.com.br/public_html
            chown lipsa7087:nobody /home/lipsaraiva.com.br/public_html
